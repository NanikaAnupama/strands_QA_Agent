version: 0.2

# Builds the Lambda container image in CodeBuild rather than locally, so no
# Docker daemon is needed on the developer machine. Runs on the free-tier
# BUILD_GENERAL1_SMALL instance; a full build is ~6-9 minutes, well inside the
# 100 free build-minutes a month.

env:
  variables:
    IMAGE_TAG: latest

phases:
  pre_build:
    commands:
      - echo "Logging in to ECR $ECR_REPO"
      - aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "${ECR_REPO%%/*}"

  build:
    commands:
      - echo "Building $ECR_REPO:$IMAGE_TAG"
      # Cache from the previous image so unchanged apt/pip layers are reused.
      - docker pull "$ECR_REPO:$IMAGE_TAG" || echo "no cached image yet"
      - >
        docker build
        --cache-from "$ECR_REPO:$IMAGE_TAG"
        -f deploy/Dockerfile
        -t "$ECR_REPO:$IMAGE_TAG"
        .

  post_build:
    commands:
      - docker push "$ECR_REPO:$IMAGE_TAG"
      - aws ecr describe-images --repository-name "${ECR_REPO#*/}" --image-ids imageTag="$IMAGE_TAG" --query 'imageDetails[0].imageSizeInBytes' --output text
